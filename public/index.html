<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WarehouseOS — Smart Warehouse Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.6.2/socket.io.min.js"></script>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:       #f0f4f8;
  --bg2:      #ffffff;
  --bg3:      #f8fafc;
  --bg4:      #edf2f7;
  --border:   #e2e8f0;
  --border2:  #cbd5e1;
  --text:     #1a202c;
  --text2:    #4a5568;
  --text3:    #94a3b8;
  --accent:   #059669;
  --accent2:  #2563eb;
  --warn:     #d97706;
  --danger:   #dc2626;
  --success:  #059669;
  --mono:     'IBM Plex Mono', monospace;
  --sans:     'IBM Plex Sans', sans-serif;
  --radius:   6px;
  --sidebar:  220px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
button{cursor:pointer;font-family:var(--sans);border:none;outline:none}
a{color:inherit;text-decoration:none}
input,select{font-family:var(--sans);font-size:13px;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:6px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent2)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg4)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Layout ── */
#layout{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:0;overflow:hidden;
  position:relative;
}
.sidebar-head{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.logo-icon{width:28px;height:28px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:16px;height:16px;stroke:#fff}
.logo-text{font-size:14px;font-weight:600;letter-spacing:-.3px;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.05em}
.sidebar-status{margin-top:10px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3);font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0;transition:background .3s}
.dot.online{background:var(--success);box-shadow:0 0 6px var(--success)}
.dot.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-section{font-size:9px;font-family:var(--mono);color:var(--text3);letter-spacing:.1em;text-transform:uppercase;padding:6px 8px 4px;margin-top:6px}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:var(--radius);
  font-size:13px;font-weight:400;color:var(--text2);
  cursor:pointer;transition:all .15s;margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:rgba(5,150,105,.1);color:var(--accent)}
.nav-item .nav-badge{
  margin-left:auto;background:var(--danger);color:#fff;
  font-size:9px;font-family:var(--mono);padding:1px 5px;
  border-radius:10px;font-weight:600;
}
.nav-icon{width:16px;height:16px;opacity:.7;flex-shrink:0}
.nav-item.active .nav-icon{opacity:1}

.sidebar-foot{padding:12px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);font-family:var(--mono)}

/* ── Main area ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Topbar ── */
#topbar{
  height:52px;min-height:52px;
  background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;gap:16px;
}
.topbar-left{display:flex;align-items:center;gap:10px}
.page-title{font-size:15px;font-weight:500}
.page-sub{font-size:11px;color:var(--text3);font-family:var(--mono)}
.topbar-right{display:flex;align-items:center;gap:10px}
.chip{
  display:flex;align-items:center;gap:5px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:20px;padding:4px 10px;
  font-size:11px;color:var(--text2);font-family:var(--mono);
}
.chip .dot{width:5px;height:5px}
.refresh-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--text2);border-radius:var(--radius);padding:5px 10px;
  font-size:12px;transition:all .15s;
}
.refresh-btn:hover{border-color:var(--accent2);color:var(--accent2)}

/* ── Content ── */
#content{flex:1;overflow-y:auto;padding:24px}

/* ── Toast ── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);padding:10px 14px;
  font-size:12px;color:var(--text);min-width:260px;max-width:360px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  animation:toast-in .25s ease;
  display:flex;align-items:flex-start;gap:8px;
}
.toast.warn{border-left:3px solid var(--warn)}
.toast.danger{border-left:3px solid var(--danger)}
.toast.success{border-left:3px solid var(--success)}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
  position:relative;overflow:hidden;
}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat.accent::before{background:var(--accent)}
.stat.blue::before{background:var(--accent2)}
.stat.warn::before{background:var(--warn)}
.stat.danger::before{background:var(--danger)}
.stat.success::before{background:var(--success)}
.stat-label{font-size:10px;color:var(--text3);font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.stat-val{font-size:28px;font-weight:600;font-family:var(--mono);line-height:1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:5px}

/* ── Section header ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:11px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}

/* ── Table ── */
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg3);color:var(--text3);font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,0,0,.025)}
.mono{font-family:var(--mono);font-size:11px;color:var(--text)}

/* ── Status badges ── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-family:var(--mono);padding:2px 8px;
  border-radius:20px;font-weight:500;white-space:nowrap;
}
.badge.placed     {background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.25)}
.badge.removed    {background:rgba(100,116,139,.1);color:#64748b;border:1px solid rgba(100,116,139,.2)}
.badge.waiting    {background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
.badge.missing    {background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.25)}
.badge.unknown    {background:rgba(139,90,246,.1);color:#8b5cf6;border:1px solid rgba(139,90,246,.2)}
.badge.ok         {background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2)}
.badge.warning    {background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}

/* ── Shelf visual ── */
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.shelf-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.shelf-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.shelf-name{font-size:13px;font-weight:500}
.floor-block{
  padding:10px 12px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .12s;
}
.floor-block:last-child{border-bottom:none}
.floor-block:hover{background:var(--bg3)}
.floor-block.warn{border-left:2px solid var(--warn)}
.floor-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.floor-label{font-size:11px;font-family:var(--mono);color:var(--text2)}
.floor-counts{font-size:10px;font-family:var(--mono);color:var(--text3)}
.capacity-bar{height:4px;background:var(--bg4);border-radius:2px;margin-bottom:5px;overflow:hidden}
.capacity-fill{height:100%;border-radius:2px;transition:width .5s ease}
.item-chips{display:flex;flex-wrap:wrap;gap:3px}
.item-chip{
  font-size:9px;font-family:var(--mono);padding:2px 6px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:3px;color:var(--text3);cursor:pointer;
  transition:border-color .12s;
}
.item-chip:hover{border-color:var(--accent2);color:var(--accent2)}
.item-chip.outbound{border:1px solid rgba(239,68,68,.55);color:#ef4444;background:rgba(239,68,68,.08);box-shadow:0 0 0 1px rgba(239,68,68,.18) inset}
.item-chip.outbound::before{content:'OUT';font-size:8px;margin-right:4px;color:#ef4444}

/* ── Progress bar fill colors ── */
.fill-ok{background:var(--success)}
.fill-warn{background:var(--warn)}
.fill-full{background:var(--danger)}

/* ── Alert cards ── */
.alert-card{
  background:var(--bg2);border:1px solid var(--border);
  border-left:3px solid var(--warn);
  border-radius:var(--radius);padding:14px 16px;
  margin-bottom:8px;display:grid;
  grid-template-columns:1fr auto;gap:8px;
}
.alert-card.danger{border-left-color:var(--danger)}
.alert-title{font-size:12px;font-weight:500;margin-bottom:4px}
.alert-meta{font-size:11px;color:var(--text3);font-family:var(--mono);display:flex;gap:12px;flex-wrap:wrap}

/* ── Item detail ── */
.detail-grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
@media(max-width:768px){.detail-grid{grid-template-columns:1fr}}
.qr-box{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.qr-visual{
  width:120px;height:120px;background:white;
  border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-family:var(--mono);color:#333;text-align:center;padding:8px;
  position:relative;overflow:hidden;
}
.qr-cell{width:8px;height:8px;background:#1a1a1a;display:inline-block}

.kv-list{display:flex;flex-direction:column;gap:0}
.kv{display:flex;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start;gap:12px}
.kv:last-child{border-bottom:none}
.kv-k{font-size:11px;color:var(--text3);font-family:var(--mono);width:140px;flex-shrink:0}
.kv-v{font-size:12px;color:var(--text);word-break:break-all}

/* ── Events feed ── */
.evt-list{display:flex;flex-direction:column;gap:0}
.evt{
  display:flex;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);
  position:relative;
}
.evt:last-child{border-bottom:none}
.evt-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.evt-dot.placed{background:var(--success)}
.evt-dot.created{background:var(--accent2)}
.evt-dot.removed{background:var(--text3)}
.evt-dot.warning{background:var(--warn)}
.evt-dot.status{background:var(--accent)}
.evt-body{flex:1;min-width:0}
.evt-type{font-size:11px;font-family:var(--mono);font-weight:500;color:var(--text)}
.evt-meta{font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--mono)}
.evt-time{font-size:10px;color:var(--text3);font-family:var(--mono);white-space:nowrap}

/* ── Action buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--radius);
  font-size:12px;font-weight:500;transition:all .15s;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#047857}
.btn-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:11px}

/* ── Divider / spacer ── */
.mb-16{margin-bottom:16px}
.mb-24{margin-bottom:24px}
.empty-state{padding:40px;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:var(--radius)}

/* ── Warehouse Map ── */
.warehouse-map{
  display:flex;gap:40px;flex-wrap:wrap;
  padding:24px;background:var(--bg2);
  border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:24px;
}
.zone-block{display:flex;flex-direction:column;gap:10px}
.zone-label{
  font-size:11px;font-family:var(--mono);font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:4px;
}
.zone-rows{display:flex;flex-direction:column;gap:10px}
.zone-row{display:flex;gap:10px}
.map-shelf{
  width:72px;height:110px;
  border:2px dashed #2d7a4f;
  border-radius:5px;
  background:rgba(16,185,129,.08);
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  transition:all .18s;
  position:relative;
}
.map-shelf:hover{
  background:rgba(16,185,129,.18);
  border-color:#10b981;
  transform:translateY(-2px);
  box-shadow:0 4px 16px rgba(16,185,129,.2);
}
.map-shelf.suggested{
  border-color:#ef4444;
  background:rgba(239,68,68,.12);
  animation:shelf-pulse 1.8s ease-in-out infinite;
}
.map-shelf.suggested:hover{
  background:rgba(239,68,68,.22);
  border-color:#f87171;
  box-shadow:0 4px 16px rgba(239,68,68,.25);
}
@keyframes shelf-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
  50%{box-shadow:0 0 0 6px rgba(239,68,68,.15)}
}
.map-shelf-label{
  font-size:10px;font-family:var(--mono);
  font-weight:600;color:var(--text2);
}
.map-shelf.suggested .map-shelf-label{color:#ef4444}
.map-shelf-sub{font-size:9px;color:var(--text3);font-family:var(--mono)}
.map-shelf-badge{
  position:absolute;top:4px;right:4px;
  background:#ef4444;color:#fff;
  font-size:8px;font-family:var(--mono);
  padding:1px 4px;border-radius:4px;font-weight:700;
}
.map-shelf-items-dot{
  display:flex;gap:2px;flex-wrap:wrap;justify-content:center;
  max-width:52px;
}
.items-dot{
  width:7px;height:7px;border-radius:1px;
  background:rgba(5,150,105,.6);
}

/* ── Shelf Detail Modal ── */
#shelf-modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  z-index:1000;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#shelf-modal-overlay.open{opacity:1;pointer-events:all}
#shelf-modal{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:10px;padding:28px;
  min-width:560px;max-width:90vw;max-height:85vh;
  overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.2);
  transform:translateY(16px);transition:transform .2s;
}
#shelf-modal-overlay.open #shelf-modal{transform:none}
.modal-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:20px;
}
.modal-title{font-size:16px;font-weight:600}
.modal-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:3px}
.modal-close{
  background:transparent;border:1px solid var(--border);
  color:var(--text2);border-radius:var(--radius);
  padding:4px 10px;font-size:13px;cursor:pointer;
  transition:all .15s;
}
.modal-close:hover{border-color:var(--danger);color:var(--danger)}

/* ── 3D Shelf simulator ── */
.shelf-3d{
  border:2px solid var(--border2);
  border-radius:8px;overflow:hidden;
  background:var(--bg3);
}
.shelf-3d-header{
  background:var(--bg4);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;justify-content:space-between;
  font-size:10px;font-family:var(--mono);color:var(--text3);
}
.shelf-level-row{
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--border);
  min-height:70px;
}
.shelf-level-row:last-child{border-bottom:none}
.shelf-level-label{
  width:52px;min-width:52px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-family:var(--mono);color:var(--text3);
  background:var(--bg4);border-right:1px solid var(--border);
  flex-direction:column;gap:3px;
}
.shelf-level-content{
  flex:1;position:relative;
  min-height:70px;
  background:repeating-linear-gradient(
    90deg,
    transparent,
    transparent 9px,
    rgba(0,0,0,.03) 9px,
    rgba(0,0,0,.03) 10px
  );
}
.shelf-floor{
  position:absolute;bottom:0;left:0;right:0;
  height:3px;background:var(--border2);
}
.shelf-item-box{
  position:absolute;bottom:3px;
  border-radius:3px 3px 0 0;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;font-family:var(--mono);
  transition:all .15s;cursor:pointer;
  overflow:hidden;
}
.shelf-item-box:hover{filter:brightness(1.2);z-index:2}
.shelf-item-box.outbound{box-shadow:0 0 0 3px rgba(239,68,68,.9),0 0 0 6px rgba(239,68,68,.16);z-index:3;animation:outbound-pulse 1.2s ease-in-out infinite}
.shelf-item-box.outbound::after{content:'OUTBOUND';position:absolute;top:4px;left:4px;right:4px;text-align:center;font-size:7px;line-height:1;padding:2px 3px;background:rgba(239,68,68,.92);color:#fff;border-radius:999px;letter-spacing:.04em}
@keyframes outbound-pulse{0%,100%{transform:translateZ(0);box-shadow:0 0 0 3px rgba(239,68,68,.9),0 0 0 6px rgba(239,68,68,.16)}50%{box-shadow:0 0 0 3px rgba(239,68,68,1),0 0 0 10px rgba(239,68,68,.1)}}
.shelf-item-box .item-label{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  transform:rotate(180deg);
  font-size:8px;opacity:.8;
  max-height:100%;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;
}
.shelf-item-suggested{
  position:absolute;bottom:3px;
  border:2px dashed #ef4444;
  border-radius:3px 3px 0 0;
  background:rgba(239,68,68,.07);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  animation:dash-anim 1s linear infinite;
}
@keyframes dash-anim{
  to{stroke-dashoffset:-8}
}
.suggested-icon{
  font-size:14px;line-height:1;
}
.suggested-label{
  font-size:7px;font-family:var(--mono);

</style>
</head>
<body>
<div id="toast-container"></div>

<!-- Shelf Detail Modal -->
<div id="shelf-modal-overlay" onclick="closeShelfModal(event)">
  <div id="shelf-modal">
    <div class="modal-head">
      <div>
        <div class="modal-title" id="modal-shelf-title">Chi tiết kệ</div>
        <div class="modal-sub" id="modal-shelf-sub"></div>
      </div>
      <button class="modal-close" onclick="closeShelfModal()">✕ Đóng</button>
    </div>
    <div id="modal-shelf-body"></div>
  </div>
</div>
<div id="layout">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.5">
            <rect x="2" y="2" width="12" height="12" rx="1"/>
            <line x1="2" y1="7" x2="14" y2="7"/>
            <line x1="8" y1="2" x2="8" y2="14"/>
          </svg>
        </div>
        <span class="logo-text">WarehouseOS</span>
      </div>
      <div class="logo-sub">Smart Warehouse Cloud</div>
      <div class="sidebar-status">
        <div class="dot pulse" id="jetson-dot"></div>
        <span id="jetson-label">Đang kết nối...</span>
      </div>
    </div>
    <nav>
      <div class="nav-section">Dashboard</div>
      <div class="nav-item active" data-page="overview" onclick="nav('overview')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/>
          <rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/>
        </svg>
        Tổng quan
      </div>
      <div class="nav-item" data-page="shelves" onclick="nav('shelves')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="2" width="12" height="12" rx="1"/>
          <line x1="2" y1="6" x2="14" y2="6"/><line x1="2" y1="10" x2="14" y2="10"/>
        </svg>
        Sơ đồ kệ
      </div>
      <div class="nav-section">Hàng hóa</div>
      <div class="nav-item" data-page="items" onclick="nav('items')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="2" width="10" height="12" rx="1"/>
          <line x1="6" y1="5" x2="10" y2="5"/><line x1="6" y1="8" x2="10" y2="8"/><line x1="6" y1="11" x2="8" y2="11"/>
        </svg>
        Quản lý hàng
      </div>
      <div class="nav-item" data-page="alerts" onclick="nav('alerts')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 2L1 13h14L8 2z"/>
          <line x1="8" y1="7" x2="8" y2="10"/><circle cx="8" cy="12" r=".5" fill="currentColor"/>
        </svg>
        Cảnh báo
        <span class="nav-badge" id="alert-badge" style="display:none">0</span>
      </div>
      <div class="nav-section">Hệ thống</div>
      <div class="nav-item" data-page="events" onclick="nav('events')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="6"/>
          <polyline points="8,5 8,8 10,10"/>
        </svg>
        Event Log
      </div>
    </nav>
    <div class="sidebar-foot">
      <div>Edge: Jetson Nano CSI</div>
      <div style="margin-top:2px;color:var(--text3)">Cloud: metadata only</div>
    </div>
  </aside>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <div class="topbar-left">
        <div>
          <div class="page-title" id="pg-title">Tổng quan</div>
          <div class="page-sub" id="pg-sub">Warehouse overview</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="chip"><div class="dot" id="ws-dot"></div><span id="ws-label">Socket.IO</span></div>
        <div class="chip" id="heartbeat-chip" style="display:none"><div class="dot online pulse"></div><span>Jetson live</span></div>
        <button class="refresh-btn" onclick="loadPage()">↺ Refresh</button>
      </div>
    </div>
    <div id="content">
      <div class="empty-state">Đang tải dữ liệu...</div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const API = '';  // same origin
let currentPage = 'overview';
let currentItemId = null;
let overviewData = null;
let allItems = [];
let allAlerts = [];
let allEvents = [];
let allRemoveRequests = [];
let alertCount = 0;

const PAGE_META = {
  overview: { title: 'Tổng quan', sub: 'Warehouse overview dashboard' },
  shelves:  { title: 'Sơ đồ kệ', sub: 'Shelf level visualization' },
  items:    { title: 'Quản lý hàng', sub: 'Item management & tracking' },
  alerts:   { title: 'Cảnh báo', sub: 'Inventory count warnings' },
  events:   { title: 'Event Log', sub: 'All system events from Jetson Nano' },
  detail:   { title: 'Chi tiết mặt hàng', sub: 'Item detail & event history' },
};

// ── Socket.IO ──────────────────────────────────────────────────────────────
const socket = io(window.location.origin, { transports: ['websocket','polling'] });

socket.on('connect', () => {
  setWsStatus(true);
  toast('Đã kết nối cloud backend', 'success');
});
socket.on('disconnect', () => setWsStatus(false));
socket.on('overview', d => { overviewData = d; if (currentPage === 'overview') renderOverview(); });
socket.on('event', e => {
  allEvents.unshift(e);
  if (e.event_type === 'item_removed' && e.item_id) {
    allRemoveRequests = allRemoveRequests.filter(r => !(r.status === 'pending' && r.item_id === e.item_id));
    if (currentPage === 'shelves') renderShelves();
    if (currentPage === 'items') renderItems();
    if (currentPage === 'detail' && e.item_id === currentItemId) renderDetail(currentItemId);
  }
  if (e.event_type === 'inventory_count_warning') {
    alertCount++;
    updateAlertBadge();
    toast(`⚠ Cảnh báo tồn kho: ${e.level_id}`, 'warn');
    if (currentPage === 'alerts') renderAlerts();
  }
  if (currentPage === 'events') renderEvents();
  if (currentPage === 'detail' && e.item_id === currentItemId) loadPage();
});
socket.on('remove_request', req => {
  if (!req) return;
  allRemoveRequests = [req, ...allRemoveRequests.filter(r => r.request_id !== req.request_id)];
  if (currentPage === 'shelves') renderShelves();
  if (currentPage === 'items') renderItems();
  if (currentPage === 'detail' && req.item_id === currentItemId) renderDetail(currentItemId);
});

socket.on('jetson_heartbeat', () => {
  document.getElementById('jetson-dot').className = 'dot online pulse';
  document.getElementById('jetson-label').textContent = 'Jetson Nano online';
  document.getElementById('heartbeat-chip').style.display = 'flex';
  clearTimeout(window._hbTimer);
  window._hbTimer = setTimeout(() => {
    document.getElementById('heartbeat-chip').style.display = 'none';
  }, 20000);
});

function setWsStatus(on) {
  const d = document.getElementById('ws-dot');
  const l = document.getElementById('ws-label');
  d.className = 'dot' + (on?' online':'');
  l.textContent = on ? 'Connected' : 'Offline';
}

// ── Navigation ─────────────────────────────────────────────────────────────
function nav(page, extra) {
  currentPage = page;
  if (page !== 'detail') document.querySelectorAll('.nav-item').forEach(el => { el.classList.toggle('active', el.dataset.page === page); });
  const m = PAGE_META[page] || PAGE_META.overview;
  document.getElementById('pg-title').textContent = extra || m.title;
  document.getElementById('pg-sub').textContent = m.sub;
  loadPage();
}

async function loadPage() {
  const c = document.getElementById('content');
  switch (currentPage) {
    case 'overview': await fetchOverview(); renderOverview(); break;
    case 'shelves':  await fetchOverview(); await fetchItems(); await fetchRemoveRequests(); renderShelves(); break;
    case 'items':    await fetchItems(); await fetchRemoveRequests(); renderItems(); break;
    case 'alerts':   await fetchAlerts(); renderAlerts(); break;
    case 'events':   await fetchEvents(); renderEvents(); break;
    case 'detail':   await renderDetail(currentItemId); break;
  }
}

// ── Fetch helpers ───────────────────────────────────────────────────────────
async function fetchOverview()  { try { const r = await fetch(`${API}/api/overview`); overviewData = await r.json(); } catch(e){} }
async function fetchItems()     { try { const r = await fetch(`${API}/api/items`); const d = await r.json(); allItems = d.items; } catch(e){} }
async function fetchAlerts()    { try { const r = await fetch(`${API}/api/alerts`); const d = await r.json(); allAlerts = d.alerts; alertCount = allAlerts.length; updateAlertBadge(); } catch(e){} }
async function fetchEvents()    { try { const r = await fetch(`${API}/api/events?limit=100`); const d = await r.json(); allEvents = d.events; } catch(e){} }
async function fetchRemoveRequests() { try { const r = await fetch(`${API}/api/remove-requests?status=pending`); const d = await r.json(); allRemoveRequests = d.requests || []; } catch(e){ allRemoveRequests = []; } }

function getPendingRequestMap() {
  const map = new Map();
  for (const req of (allRemoveRequests || [])) {
    if (req && req.status === 'pending' && req.item_id) map.set(req.item_id, req);
  }
  return map;
}

function getPendingShelfCounts() {
  const counts = {};
  for (const req of (allRemoveRequests || [])) {
    if (!req || req.status !== 'pending') continue;
    const sid = req.shelf_id;
    if (sid) counts[sid] = (counts[sid] || 0) + 1;
  }
  return counts;
}

function updateAlertBadge() {
  const b = document.getElementById('alert-badge');
  if (alertCount > 0) { b.style.display='inline-block'; b.textContent = alertCount; }
  else b.style.display='none';
}

// ── Render: Overview ────────────────────────────────────────────────────────
function renderOverview() {
  const d = overviewData;
  if (!d) { document.getElementById('content').innerHTML = '<div class="empty-state">Đang tải...</div>'; return; }

  const shelfHtml = (d.shelves || []).map(sh => {
    if (!sh) return '';
    const levels = (sh.levels || []).slice().reverse();
    return `<div class="shelf-box">
      <div class="shelf-head">
        <span class="shelf-name">${sh.label || sh.shelf_id}</span>
        <span style="font-size:10px;color:var(--text3);font-family:var(--mono)">${sh.shelf_id}</span>
      </div>
      ${levels.map(lv => {
        const pct = Math.round((lv.used_cm / lv.capacity_cm) * 100);
        const warn = lv.expected_count !== lv.detected_count;
        const fillClass = pct >= 90 ? 'fill-full' : pct >= 65 ? 'fill-warn' : 'fill-ok';
        return `<div class="floor-block${warn?' warn':''}">
          <div class="floor-row-top">
            <span class="floor-label">T${lv.level_num}</span>
            <div style="display:flex;gap:6px;align-items:center">
              ${warn ? `<span class="badge warning">⚠ mismatch</span>` : ''}
              <span class="floor-counts">${lv.detected_count}/${lv.expected_count}</span>
            </div>
          </div>
          <div class="capacity-bar"><div class="capacity-fill ${fillClass}" style="width:${pct}%"></div></div>
          <div style="font-size:9px;color:var(--text3);font-family:var(--mono)">${lv.used_cm}/${lv.capacity_cm}cm · ${lv.items?.length||0} items</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="stat-grid">
      <div class="stat accent">
        <div class="stat-label">Tổng mặt hàng</div>
        <div class="stat-val">${d.total_items}</div>
        <div class="stat-sub">Toàn bộ hệ thống</div>
      </div>
      <div class="stat success">
        <div class="stat-label">Đang trên kệ</div>
        <div class="stat-val">${d.placed}</div>
        <div class="stat-sub">Đã xác nhận vị trí</div>
      </div>
      <div class="stat blue">
        <div class="stat-label">Chờ xếp kệ</div>
        <div class="stat-val">${d.waiting}</div>
        <div class="stat-sub">Jetson đang chờ xác nhận</div>
      </div>
      <div class="stat warn">
        <div class="stat-label">Cảnh báo tích cực</div>
        <div class="stat-val">${d.active_warnings}</div>
        <div class="stat-sub">inventory_count_warning</div>
      </div>
      <div class="stat">
        <div class="stat-label">Đã xuất</div>
        <div class="stat-val">${d.removed}</div>
        <div class="stat-sub">Removed từ kho</div>
      </div>
      <div class="stat danger">
        <div class="stat-label">Missing suspected</div>
        <div class="stat-val">${d.missing_suspected||0}</div>
        <div class="stat-sub">Phát hiện bất thường</div>
      </div>
    </div>

    <div class="sec-head mb-16">
      <span class="sec-title">Trạng thái kệ hàng — Expected vs Detected</span>
      <button class="btn btn-ghost btn-sm" onclick="nav('shelves')">Xem chi tiết →</button>
    </div>
    <div class="shelf-grid mb-24">${shelfHtml}</div>

    <div class="sec-head mb-16">
      <span class="sec-title">Edge device info</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
      ${[
        ['Edge device','Jetson Nano (NVIDIA)'],
        ['Camera','CSI — Sony IMX219'],
        ['Vision model','Hybrid detection model'],
        ['Data flow','Edge → Cloud metadata only'],
        ['Protocol','MQTT / HTTP POST'],
        ['Cloud role','Metadata storage + Dashboard'],
      ].map(([k,v])=>`<div class="card-sm"><div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">${k}</div><div style="font-size:12px;color:var(--text)">${v}</div></div>`).join('')}
    </div>
  `;
}

// ── Render: Shelves ─────────────────────────────────────────────────────────
function renderShelves() {
  const d = overviewData;
  if (!d) { document.getElementById('content').innerHTML = '<div class="empty-state">Đang tải...</div>'; return; }

  // Build list of waiting items to find suggested shelves
  const waitingItems = allItems.filter(i => i.status === 'waiting_for_placement' && i.suggested_position);
  const pendingReqMap = getPendingRequestMap();
  const pendingOutboundItems = allItems.filter(i => pendingReqMap.has(i.item_id));

  document.getElementById('content').innerHTML = `
    <div class="sec-head mb-16">
      <span class="sec-title">Sơ đồ kho — ${(d.shelves||[]).length} kệ · ${overviewData.placed||0} items đang trên kệ · ${waitingItems.length} chờ xếp</span>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);color:#ef4444">
          <span style="width:12px;height:12px;border:2px dashed #ef4444;border-radius:2px;display:inline-block"></span>Kệ gợi ý
        </span>
        <span style="display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);color:#ef4444">
          <span style="width:12px;height:12px;border:2px solid #ef4444;border-radius:2px;background:rgba(239,68,68,.08);display:inline-block"></span>Outbound đang chờ lấy
        </span>
        <span style="display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);color:var(--success)">
          <span style="width:12px;height:12px;border:2px dashed #2d7a4f;border-radius:2px;background:rgba(16,185,129,.1);display:inline-block"></span>Kệ bình thường
        </span>
      </div>
    </div>
    <div id="wh-map-container"></div>
    <div class="sec-head" style="margin-top:24px;margin-bottom:14px">
      <span class="sec-title">Chi tiết từng kệ</span>
      <span style="font-size:10px;color:var(--text3);font-family:var(--mono)">T4 = tầng cao nhất</span>
    </div>
    <div class="shelf-grid" id="shelf-detail-grid"></div>
  `;

  renderWarehouseMap(d, waitingItems, pendingOutboundItems);
  renderShelfDetailGrid(d, waitingItems, pendingReqMap);
}

// Group shelves into zones of 2 (A+B → KHU A, C+D → KHU B, ...)
function getZoneLabel(shelfId) {
  const id = String(shelfId).toUpperCase();
  // Extract trailing letter: A→0, B→1, C→2, D→3, ...
  const m = id.match(/([A-Z])$/);
  if (m) {
    const idx = m[1].charCodeAt(0) - 65; // A=0, B=1, C=2, D=3
    const zoneIdx = Math.floor(idx / 2);  // pair: 0+1→zone0, 2+3→zone1
    const zoneChar = String.fromCharCode(65 + zoneIdx); // 0→A, 1→B
    return 'KHU ' + zoneChar;
  }
  return 'KHU ' + shelfId;
}

function renderWarehouseMap(d, waitingItems, pendingOutboundItems = []) {
  const suggestedShelfIds = new Set(
    waitingItems.map(i => i.suggested_position?.shelf_id).filter(Boolean)
  );
  const outboundShelfIds = new Set(
    pendingOutboundItems.map(i => (i.placed_position || i.suggested_position)?.shelf_id).filter(Boolean)
  );

  // Group shelves by zone label
  const zones = {};
  for (const sh of (d.shelves || [])) {
    if (!sh) continue;
    const zone = getZoneLabel(sh.shelf_id);
    if (!zones[zone]) zones[zone] = [];
    zones[zone].push(sh);
  }

  // Determine how many items are on each shelf
  const shelfItemCount = {};
  for (const sh of (d.shelves || [])) {
    if (!sh) continue;
    shelfItemCount[sh.shelf_id] = (sh.levels || []).reduce((s, l) => s + (l.items?.length || 0), 0);
  }

  // Render waiting item count per shelf
  const shelfWaitCount = {};
  for (const it of waitingItems) {
    const sid = it.suggested_position?.shelf_id;
    if (sid) shelfWaitCount[sid] = (shelfWaitCount[sid] || 0) + 1;
  }
  const shelfOutboundCount = {};
  for (const it of pendingOutboundItems) {
    const sid = (it.placed_position || it.suggested_position)?.shelf_id;
    if (sid) shelfOutboundCount[sid] = (shelfOutboundCount[sid] || 0) + 1;
  }

  const zoneKeys = Object.keys(zones);
  const html = `<div class="warehouse-map">
    ${zoneKeys.map(zk => {
      const shelves = zones[zk];
      // Lay shelves in rows of up to 2 per row
      const rows = [];
      for (let i = 0; i < shelves.length; i += 2) rows.push(shelves.slice(i, i+2));
      return `<div class="zone-block">
        <div class="zone-label">${zk}</div>
        <div class="zone-rows">
          ${rows.map(row => `<div class="zone-row">
            ${row.map(sh => {
              const isSuggested = suggestedShelfIds.has(sh.shelf_id);
              const isOutbound = outboundShelfIds.has(sh.shelf_id);
              const cnt = shelfItemCount[sh.shelf_id] || 0;
              const wcnt = shelfWaitCount[sh.shelf_id] || 0;
              const ocnt = shelfOutboundCount[sh.shelf_id] || 0;
              const dots = Array.from({length: Math.min(cnt, 6)}, () => '<div class="items-dot"></div>').join('');
              return `<div class="map-shelf${isSuggested?' suggested':''}${isOutbound?' outbound':''}" onclick="openShelfModal('${sh.shelf_id}')" title="${sh.label||sh.shelf_id} — click để xem chi tiết">
                ${isOutbound ? `<div class="map-shelf-badge outbound">${ocnt} OUT</div>` : (isSuggested ? `<div class="map-shelf-badge waiting">${wcnt} chờ</div>` : '')}
                <div class="map-shelf-label">${sh.label||sh.shelf_id}</div>
                <div class="map-shelf-items-dot">${dots}</div>
                <div class="map-shelf-sub">${cnt} vật</div>
              </div>`;
            }).join('')}
          </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;

  document.getElementById('wh-map-container').innerHTML = html;
}

function renderShelfDetailGrid(d, waitingItems, pendingReqMap = new Map()) {
  const shelfHtml = (d.shelves || []).map(sh => {
    if (!sh) return '';
    // Sort levels T1 at top to match 3D model
    const levels = (sh.levels || []).slice().sort((a,b) => Number(a.level_num||0) - Number(b.level_num||0));
    return `<div class="shelf-box">
      <div class="shelf-head">
        <div>
          <div class="shelf-name">${sh.label || sh.shelf_id}</div>
          <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px">${sh.physical_size_cm?.w}×${sh.physical_size_cm?.h}×${sh.physical_size_cm?.d} cm</div>
        </div>
        <div style="display:flex;gap:4px;align-items:center">
          <span class="badge ${(sh.levels||[]).some(l=>l.status==='warning')?'warning':'ok'}">${(sh.levels||[]).some(l=>l.status==='warning')?'⚠ warn':'✓ ok'}</span>
          <button class="btn btn-ghost btn-sm" onclick="openShelfModal('${sh.shelf_id}')">3D</button>
        </div>
      </div>
      ${levels.map(lv => {
        const pct = Math.round((lv.used_cm / lv.capacity_cm) * 100);
        const warn = lv.expected_count !== lv.detected_count;
        const fillClass = pct >= 90 ? 'fill-full' : pct >= 65 ? 'fill-warn' : 'fill-ok';
        const items = lv.items || [];
        const outboundItems = items.filter(it => pendingReqMap.has(it.item_id));
        return `<div class="floor-block${warn?' warn':''}">
          <div class="floor-row-top">
            <span class="floor-label">Tầng ${lv.level_num}</span>
            <span style="display:flex;gap:6px;align-items:center">
              ${outboundItems.length ? `<span class="badge danger" style="font-size:9px">OUTBOUND ${outboundItems.length}</span>` : ''}
              <span style="font-size:10px;font-family:var(--mono);color:${warn?'var(--warn)':'var(--text3)'}">
                ${lv.detected_count}/${lv.expected_count}
              </span>
            </span>
          </div>
          <div class="capacity-bar"><div class="capacity-fill ${fillClass}" style="width:${pct}%"></div></div>
          <div style="font-size:9px;color:var(--text3);font-family:var(--mono);margin-bottom:6px">${lv.used_cm}/${lv.capacity_cm} cm (${pct}%)</div>
          <div class="item-chips">
            ${items.map(it=>`<span class="item-chip ${pendingReqMap.has(it.item_id)?'outbound':''}" onclick="openDetail('${it.item_id}')">${it.item_id.slice(-4)}</span>`).join('')}
            ${items.length===0?`<span style="font-size:9px;color:var(--text3);font-style:italic">trống</span>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  document.getElementById('shelf-detail-grid').innerHTML = shelfHtml;
}

// ── Shelf 3D Modal ───────────────────────────────────────────────────────────
async function openShelfModal(shelfId) {
  const overlay = document.getElementById('shelf-modal-overlay');
  const body = document.getElementById('modal-shelf-body');
  const title = document.getElementById('modal-shelf-title');
  const sub = document.getElementById('modal-shelf-sub');

  body.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3)">Đang tải...</div>';
  overlay.classList.add('open');

  // Ensure fresh data
  await fetchOverview();
  if (allItems.length === 0) await fetchItems();

  const d = overviewData;
  const shelf = (d?.shelves || []).find(s => s?.shelf_id === shelfId);
  if (!shelf) { body.innerHTML = '<div class="empty-state">Không tìm thấy kệ</div>'; return; }

  const waitingItems = allItems.filter(i =>
    i.status === 'waiting_for_placement' &&
    i.suggested_position?.shelf_id === shelfId
  );
  const pendingReqMap = getPendingRequestMap();
  const outboundItems = allItems.filter(i => pendingReqMap.has(i.item_id) && (i.placed_position || i.suggested_position)?.shelf_id === shelfId);

  title.textContent = `Mô phỏng kệ: ${shelf.label || shelf.shelf_id}`;
  sub.textContent = `${shelf.shelf_id} · ${shelf.physical_size_cm?.w}×${shelf.physical_size_cm?.h}×${shelf.physical_size_cm?.d} cm · ${waitingItems.length} vật đang chờ gợi ý · ${outboundItems.length} outbound`;

  body.innerHTML = renderShelfDetail3D(shelf, waitingItems, pendingReqMap);
}

function closeShelfModal(evt) {
  if (evt && evt.target !== document.getElementById('shelf-modal-overlay')) return;
  document.getElementById('shelf-modal-overlay').classList.remove('open');
}

// Color palette for placed items
const ITEM_COLORS = [
  { bg: 'rgba(0,212,170,.22)', border: '#00d4aa', text: '#00d4aa' },
  { bg: 'rgba(0,153,204,.22)', border: '#0099cc', text: '#0099cc' },
  { bg: 'rgba(139,90,246,.22)', border: '#8b5cf6', text: '#8b5cf6' },
  { bg: 'rgba(245,158,11,.18)', border: '#f59e0b', text: '#f59e0b' },
  { bg: 'rgba(236,72,153,.18)', border: '#ec4899', text: '#ec4899' },
  { bg: 'rgba(59,130,246,.2)',  border: '#3b82f6', text: '#3b82f6' },
];

function renderShelfDetail3D(shelf, waitingItems, pendingReqMap = new Map()) {
  // Sort levels: T1 at top (first), T4 at bottom
  const levels = [...(shelf.levels || [])].sort((a,b) => Number(a.level_num||0) - Number(b.level_num||0));
  const capacityCm = shelf.physical_size_cm?.w || 60;

  // Scale: pixels per cm — larger for readability
  const pxPerCm = 20;
  const totalW = capacityCm * pxPerCm;
  const levelH = 130; // px per level

  let colorIdx = 0;

  const levelsHtml = levels.map((lv, idx) => {
    const placedItems = (lv.items || []);
    const suggForLevel = waitingItems.filter(i => i.suggested_position?.level_id === lv.level_id);

    const cap = capacityCm || 1;
    let itemBoxes = '';
    for (let i = 0; i < placedItems.length; i++) {
      const it = placedItems[i];
      const pos = it.placed_position || it.suggested_position || {};
      const xOff = Number(pos.x_offset_cm || 0);
      const wCm  = Number(it.size_cm?.w || 3);
      const hCm  = Number(it.size_cm?.h || 5);
      const xPct = (xOff / cap) * 100;
      const wPct = (wCm / cap) * 100;
      const hPx  = Math.min(Math.round(hCm * pxPerCm), levelH - 10);
      const col  = ITEM_COLORS[colorIdx % ITEM_COLORS.length];
      colorIdx++;
      const shortId = it.item_id.slice(-6);
      const isOutbound = pendingReqMap.has(it.item_id);
      const requestId = isOutbound ? pendingReqMap.get(it.item_id)?.request_id : null;
      itemBoxes += `<div class="shelf-item-box ${isOutbound?'outbound':''}"
        style="left:${xPct}%;width:${wPct}%;height:${hPx}px;
               background:${col.bg};border:2px solid ${isOutbound ? '#ef4444' : col.border};color:${isOutbound ? '#ef4444' : col.text}"
        onclick="openDetail('${it.item_id}')" title="${it.item_id} — ${it.size_cm?.w}×${it.size_cm?.h}×${it.size_cm?.d} cm · x=${xOff}cm${isOutbound ? ' · outbound pending' : ''}${requestId ? ' · request='+requestId : ''}">
        <span class="item-label">${shortId}</span>
      </div>`;
    }

    // Suggested placements
    for (let i = 0; i < suggForLevel.length; i++) {
      const it = suggForLevel[i];
      const pos = it.suggested_position || {};
      const xOff = Number(pos.x_offset_cm || 0);
      const wCm  = Number(it.size_cm?.w || 3);
      const hCm  = Number(it.size_cm?.h || 5);
      const xPct = (xOff / cap) * 100;
      const wPct = (wCm / cap) * 100;
      const hPx  = Math.min(Math.round(hCm * pxPerCm), levelH - 10);
      itemBoxes += `<div class="shelf-item-suggested"
        style="left:${xPct}%;width:${wPct}%;height:${hPx}px"
        title="Gợi ý: ${it.item_id} — ${it.size_cm?.w}×${it.size_cm?.h}×${it.size_cm?.d} cm · x=${xOff}cm">
        <span class="suggested-icon">📦</span>
        <span class="suggested-label">${it.item_id.slice(-4)}</span>
      </div>`;
    }

    const pct = Math.round(((lv.used_cm||0) / (lv.capacity_cm||1)) * 100);
    const warn = lv.expected_count !== lv.detected_count;
    const isTop = idx === 0;
    return `<div class="shelf-level-row">
      <div class="shelf-level-label">
        <span style="font-weight:600;color:${suggForLevel.length?'#ef4444':'var(--text2)'}">T${lv.level_num}</span>
        ${isTop ? `<span style="font-size:7px;color:var(--accent);font-weight:600">TRÊN</span>` : ''}
        <span style="font-size:8px">${pct}%</span>
        ${warn?`<span style="color:var(--warn);font-size:8px">⚠</span>`:''}
      </div>
      <div class="shelf-level-content" style="height:${levelH}px">
        ${itemBoxes}
        <div class="shelf-floor"></div>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="shelf-3d">
      <div class="shelf-3d-header">
        <span>← ${capacityCm} cm →</span>
        <span>${levels.length} tầng · T${levels[0]?.level_num||1} (trên cùng) → T${levels[levels.length-1]?.level_num||4} (thấp nhất)</span>
      </div>
      <div style="overflow-x:auto">
        ${levelsHtml}
      </div>
    </div>
    <div class="shelf-legend">
      <div class="legend-item">
        <div class="legend-box" style="background:rgba(0,212,170,.22);border:1.5px solid #00d4aa"></div>
        <span>Vật đã đặt (click để xem chi tiết)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dashed"></div>
        <span>Vị trí gợi ý (chờ xếp kệ)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background:rgba(239,68,68,.08);border:2px solid #ef4444"></div>
        <span>Outbound đang chờ Jetson lấy ra</span>
      </div>
      <div class="legend-item">
        <div class="legend-box" style="background:var(--bg4);border:1px solid var(--border)"></div>
        <span>Khoảng trống</span>
      </div>
    </div>
    ${waitingItems.length > 0 ? `
    <div style="margin-top:14px;padding:12px 14px;background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:var(--radius)">
      <div style="font-size:11px;font-weight:600;color:#ef4444;margin-bottom:8px">📦 Vật đang chờ xếp vào kệ này (${waitingItems.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${waitingItems.map(it => `
          <div style="background:var(--bg3);border:1px solid rgba(239,68,68,.3);border-radius:4px;padding:5px 10px;font-size:10px;font-family:var(--mono)">
            <span style="color:#ef4444">${it.item_id}</span>
            <span style="color:var(--text3)"> · ${it.size_cm?.w}×${it.size_cm?.h}×${it.size_cm?.d}cm</span>
            <span style="color:var(--text3)"> · ${it.suggested_position?.level_id||'?'} x=${it.suggested_position?.x_offset_cm||0}cm</span>
          </div>
        `).join('')}
      </div>
    </div>` : ''}
  `;
}

// ── Render: Items ───────────────────────────────────────────────────────────
function renderItems() {
  const statusFilter = document.getElementById('sf') ? document.getElementById('sf').value : '';
  const search = document.getElementById('sq') ? document.getElementById('sq').value.toLowerCase() : '';

  const pendingReqMap = getPendingRequestMap();
  let items = allItems;
  if (statusFilter) items = items.filter(i => i.status === statusFilter);
  if (search) items = items.filter(i =>
    i.item_id.toLowerCase().includes(search) ||
    (i.placed_position?.shelf_id||'').toLowerCase().includes(search) ||
    (i.placed_position?.level_id||'').toLowerCase().includes(search)
  );

  const rows = items.map(it => {
    const pos = it.placed_position || it.suggested_position;
    const isOutboundPending = pendingReqMap.has(it.item_id);
    const statusText = isOutboundPending ? 'outbound_pending' : it.status;
    const statusLabel = isOutboundPending ? 'danger' : ({
      placed:'placed', removed:'removed',
      waiting_for_placement:'waiting',
      missing_suspected:'missing', unknown_object:'unknown'
    }[it.status] || 'unknown');
    return `<tr>
      <td><span class="mono" style="cursor:pointer;color:var(--accent2)" onclick="openDetail('${it.item_id}')">${it.item_id}</span></td>
      <td><span class="mono" style="font-size:10px">${it.qr_data}</span></td>
      <td><span class="mono">${it.size_cm?.w}×${it.size_cm?.h}×${it.size_cm?.d} cm</span></td>
      <td><span class="badge ${statusLabel}">${statusText}</span></td>
      <td><span class="mono">${pos?.shelf_id||'—'}</span></td>
      <td><span class="mono">${pos?.level_id||'—'}</span></td>
      <td><span class="mono" style="font-size:10px">${pos?.x_offset_cm!=null?pos.x_offset_cm+'cm':'—'}</span></td>
      <td><span class="mono" style="font-size:10px">${fmtDate(it.created_at)}</span></td>
      <td>
        <div style="display:flex;gap:4px">
          <button class="btn btn-ghost btn-sm" onclick="openDetail('${it.item_id}')">Detail</button>
          ${isOutboundPending?`<span class="badge danger">chờ Jetson</span>`:(it.status==='placed'?`<button class="btn btn-danger btn-sm" onclick="removeItem('${it.item_id}')">Xuất</button>`:'')}
        </div>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text3)">Không có dữ liệu</td></tr>`;

  document.getElementById('content').innerHTML = `
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      <input id="sq" placeholder="Tìm theo ID, kệ, tầng..." style="width:220px" oninput="renderItems()">
      <select id="sf" onchange="renderItems()">
        <option value="">Tất cả trạng thái</option>
        <option value="placed">placed</option>
        <option value="waiting_for_placement">waiting_for_placement</option>
        <option value="removed">removed</option>
        <option value="missing_suspected">missing_suspected</option>
        <option value="unknown_object">unknown_object</option>
      </select>
      <span style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-left:4px">${items.length} items</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Item ID</th><th>QR Data</th><th>Size (W×H×D)</th><th>Status</th>
          <th>Kệ</th><th>Tầng</th><th>Offset</th><th>Created</th><th>Action</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ── Render: Item Detail ─────────────────────────────────────────────────────
async function openDetail(itemId) {
  currentItemId = itemId;
  currentPage = 'detail';
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('pg-title').textContent = 'Chi tiết: ' + itemId;
  document.getElementById('pg-sub').textContent = 'Item detail & event history';
  await renderDetail(itemId);
}

async function renderDetail(itemId) {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty-state">Đang tải...</div>';
  try {
    await fetchRemoveRequests();
    const r = await fetch(`${API}/api/items/${itemId}`);
    if (!r.ok) { c.innerHTML = '<div class="empty-state">Không tìm thấy item</div>'; return; }
    const { item, events } = await r.json();

    const pos = item.placed_position || item.suggested_position;
    const pendingReqMap = getPendingRequestMap();
    const pendingReq = pendingReqMap.get(item.item_id);
    const detailStatusText = pendingReq ? 'outbound_pending' : item.status;
    const statusLabel = pendingReq ? 'danger' : ({ placed:'placed', removed:'removed', waiting_for_placement:'waiting', missing_suspected:'missing', unknown_object:'unknown' }[item.status] || 'unknown');

    // Draw a simple QR-like pattern
    const qrPat = genQRPattern(item.item_id);

    const evtHtml = events.length === 0 ? '<div style="padding:16px;color:var(--text3);font-size:12px">Không có events</div>'
      : events.map(e => {
        const m = { item_created:'created', item_placed:'placed', item_removed:'removed', inventory_count_warning:'warning' };
        return `<div class="evt">
          <div class="evt-dot ${m[e.event_type]||'status'}"></div>
          <div class="evt-body">
            <div class="evt-type">${e.event_type}</div>
            <div class="evt-meta">${e.level_id?`level: ${e.level_id} · `:''}${JSON.stringify(e.payload||{}).slice(0,60)}</div>
          </div>
          <div class="evt-time">${fmtDate(e.timestamp)}</div>
        </div>`;
      }).join('');

    c.innerHTML = `
      <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center">
        <button class="btn btn-ghost btn-sm" onclick="nav('items')">← Quay lại</button>
        <span class="badge ${statusLabel}">${detailStatusText}</span>
        ${pendingReq ? `<span class="badge danger">Request ${pendingReq.request_id.slice(0,8)}</span>` : ''}
        ${!pendingReq && item.status==='placed'?`<button class="btn btn-danger btn-sm" onclick="removeItem('${item.item_id}')">Xuất kho</button>`:''}
      </div>
      <div class="detail-grid">
        <div>
          <div class="qr-box mb-16">
            <div style="font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:8px">QR Code</div>
            <div class="qr-visual">${qrPat}</div>
            <div style="font-size:10px;font-family:var(--mono);color:var(--text2);text-align:center">${item.qr_data}</div>
            <div style="font-size:9px;color:var(--text3);font-family:var(--mono)">${item.qr_path}</div>
          </div>
          <div class="card-sm">
            <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:10px;letter-spacing:.07em;text-transform:uppercase">Thông số vật lý</div>
            <div class="kv-list">
              <div class="kv"><span class="kv-k">Width</span><span class="kv-v mono">${item.size_cm?.w} cm</span></div>
              <div class="kv"><span class="kv-k">Height</span><span class="kv-v mono">${item.size_cm?.h} cm</span></div>
              <div class="kv"><span class="kv-k">Depth</span><span class="kv-v mono">${item.size_cm?.d} cm</span></div>
            </div>
          </div>
        </div>
        <div>
          <div class="card mb-16">
            <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:12px;letter-spacing:.07em;text-transform:uppercase">Metadata</div>
            <div class="kv-list">
              <div class="kv"><span class="kv-k">Item ID</span><span class="kv-v mono">${item.item_id}</span></div>
              <div class="kv"><span class="kv-k">QR Data</span><span class="kv-v mono">${item.qr_data}</span></div>
              <div class="kv"><span class="kv-k">Status</span><span class="kv-v"><span class="badge ${statusLabel}">${detailStatusText}</span></span></div>
              ${pendingReq ? `<div class="kv"><span class="kv-k">Outbound request</span><span class="kv-v mono">${pendingReq.request_id} · pending</span></div>` : ''}
              <div class="kv"><span class="kv-k">Suggested position</span><span class="kv-v mono">${item.suggested_position?`${item.suggested_position.shelf_id} · ${item.suggested_position.level_id} · x=${item.suggested_position.x_offset_cm}cm`:'—'}</span></div>
              <div class="kv"><span class="kv-k">Placed position</span><span class="kv-v mono">${item.placed_position?`${item.placed_position.shelf_id} · ${item.placed_position.level_id} · x=${item.placed_position.x_offset_cm}cm`:'—'}</span></div>
              <div class="kv"><span class="kv-k">Created at</span><span class="kv-v mono">${fmtDate(item.created_at)}</span></div>
              <div class="kv"><span class="kv-k">Updated at</span><span class="kv-v mono">${fmtDate(item.updated_at)}</span></div>
            </div>
          </div>
          <div class="card">
            <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:12px;letter-spacing:.07em;text-transform:uppercase">Event history (${events.length})</div>
            <div class="evt-list">${evtHtml}</div>
          </div>
        </div>
      </div>
    `;
  } catch(e) { c.innerHTML = '<div class="empty-state">Lỗi tải dữ liệu</div>'; }
}

// ── Actions ─────────────────────────────────────────────────────────────────
async function removeItem(itemId) {
  if (!confirm(`Xác nhận xuất kho item ${itemId}?`)) return;
  try {
    const r = await fetch(`${API}/api/items/${itemId}/remove-request`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ note: 'Dashboard export' }) });
    if (r.ok) {
      toast(`✓ ${itemId} xuất kho thành công`, 'success');
      await fetchItems();
      if (currentPage === 'items') renderItems();
      if (currentPage === 'detail') await renderDetail(itemId);
    } else {
      const e = await r.json(); toast(`Lỗi: ${e.error}`, 'danger');
    }
  } catch(e) { toast('Lỗi kết nối server', 'danger'); }
}

// ── Helpers ─────────────────────────────────────────────────────────────────
function fmtDate(s) {
  if (!s) return '—';
  try {
    const d = new Date(s);
    return d.toLocaleString('vi-VN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch { return s; }
}

function genQRPattern(seed) {
  // Generate deterministic QR-like pattern from seed string
  let h = 0;
  for (let i = 0; i < seed.length; i++) { h = ((h << 5) - h) + seed.charCodeAt(i); h |= 0; }
  const size = 9;
  const cells = [];
  for (let i = 0; i < size*size; i++) {
    h = ((h << 5) - h) + i; h |= 0;
    cells.push((Math.abs(h) % 3) < 2 ? 1 : 0);
  }
  // Force corner marks
  [[0,0],[0,1],[1,0],[1,1],[0,7],[0,8],[1,7],[1,8],[7,0],[8,0],[7,1],[8,1]].forEach(([r,c]) => cells[r*size+c]=1);
  const cs = 11;
  const svgCells = cells.map((v,i) => v ? `<rect x="${(i%size)*cs}" y="${Math.floor(i/size)*cs}" width="${cs}" height="${cs}" fill="#111"/>` : '').join('');
  return `<svg viewBox="0 0 ${size*cs} ${size*cs}" width="100" height="100" style="background:white;border-radius:2px">${svgCells}</svg>`;
}

function toast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
